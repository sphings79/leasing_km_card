<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Leasing KM Card for Home Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151829"/>
      <stop offset="55%" stop-color="#1D2138"/>
      <stop offset="100%" stop-color="#161A2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B6CFF"/>
      <stop offset="55%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#FFB81C"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#9BE04F"/>
      <stop offset="100%" stop-color="#FFB81C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g stroke="#5B6CFF" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M120 0V340M280 0V340M440 0V340M760 0V340M920 0V340M1080 0V340"/>
  </g>

  <text x="72" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#F2F4FC">Leasing KM Card</text>
  <text x="72" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#8C9BFF">Lovelace card for Home Assistant</text>
  <text x="72" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#98A2C0">Track your leased car&#8217;s mileage allowance &#183; target vs. actual &#183; forecast</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="248" width="126" height="34" rx="17" fill="#5B6CFF" fill-opacity="0.14" stroke="#5B6CFF" stroke-opacity="0.45"/>
    <text x="135" y="270" fill="#A8B2FF" text-anchor="middle">Gauge</text>
    <rect x="210" y="248" width="140" height="34" rx="17" fill="#4ADE80" fill-opacity="0.13" stroke="#4ADE80" stroke-opacity="0.45"/>
    <text x="280" y="270" fill="#8CEBB0" text-anchor="middle">Forecast</text>
    <rect x="362" y="248" width="152" height="34" rx="17" fill="#FFB81C" fill-opacity="0.13" stroke="#FFB81C" stroke-opacity="0.45"/>
    <text x="438" y="270" fill="#FFD37A" text-anchor="middle">UI Editor</text>
    <rect x="526" y="248" width="112" height="34" rx="17" fill="#5B6CFF" fill-opacity="0.14" stroke="#5B6CFF" stroke-opacity="0.45"/>
    <text x="582" y="270" fill="#A8B2FF" text-anchor="middle">HACS</text>
  </g>

  <!-- gauge illustration -->
  <g transform="translate(880,96)">
    <rect x="-90" y="-22" width="290" height="200" rx="16" fill="#232741" fill-opacity="0.55" stroke="#5B6CFF" stroke-opacity="0.25"/>
    <!-- semicircle track -->
    <path d="M-38 118 A 93 93 0 0 1 148 118" fill="none" stroke="#2E3455" stroke-width="18" stroke-linecap="round"/>
    <path d="M-38 118 A 93 93 0 0 1 89.2 31.5" fill="none" stroke="url(#arc)" stroke-width="18" stroke-linecap="round"/>
    <!-- target tick -->
    <path d="M68.1 35.0 L71.1 16.3" stroke="#F2F4FC" stroke-width="4" stroke-linecap="round"/>
    <!-- needle -->
    <path d="M55 118 L83.7 45.5" stroke="#F2F4FC" stroke-width="5" stroke-linecap="round"/>
    <circle cx="55" cy="118" r="9" fill="#5B6CFF" stroke="#F2F4FC" stroke-width="3"/>
    <text x="55" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F2F4FC" text-anchor="middle">62 %</text>
    <text x="55" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#98A2C0" text-anchor="middle">of 80.000 km</text>
  </g>
</svg>
